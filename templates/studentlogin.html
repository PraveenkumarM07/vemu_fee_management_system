<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Login - VEMU Fee Management</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root {
            --primary: #4f46e5;
            --primary-light: #818cf8;
            --secondary: #10b981;
            --accent: #f59e0b;
            --gradient-text: linear-gradient(120deg, #4f46e5, #10b981);
            --gradient-button: linear-gradient(135deg, #4f46e5 0%, #818cf8 100%);
            --gradient-hover: linear-gradient(135deg, #3730a3 0%, #6366f1 100%);
            --text-light: #ffffff;
            --text-dark: #1e293b;
            --shadow-neon: 0 0 15px rgba(79, 70, 229, 0.3);
            --dark: #1e1b4b;
            --light: #f5f3ff;
            --white: #ffffff;
            --danger: #ef4444;
            --success: #10b981;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, var(--secondary) 0%, var(--primary) 100%);
            padding: 2rem;
            position: relative;
            overflow: hidden;
        }

        body::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: url('data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><defs><pattern id="grid" width="10" height="10" patternUnits="userSpaceOnUse"><path d="M 10 0 L 0 0 0 10" fill="none" stroke="rgba(255,255,255,0.1)" stroke-width="0.5"/></pattern></defs><rect width="100" height="100" fill="url(%23grid)"/></svg>');
            z-index: 0;
        }

        .container {
            display: flex;
            max-width: 1200px;
            width: 100%;
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(20px);
            border-radius: 2rem;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.1);
            overflow: hidden;
            position: relative;
            z-index: 1;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .login-section {
            flex: 1;
            padding: 3rem;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .dashboard-section {
            flex: 1;
            padding: 3rem;
            background: var(--light);
            display: none;
        }

        .dashboard-section.active {
            display: block;
        }

        .login-header {
            text-align: center;
            margin-bottom: 2.5rem;
        }

        .login-header .icon {
            width: 80px;
            height: 80px;
            background: var(--gradient-button);
            border-radius: 1.5rem;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 1.5rem;
            box-shadow: 0 8px 16px rgba(79, 70, 229, 0.3);
        }

        .login-header .icon i {
            font-size: 2rem;
            color: var(--text-light);
        }

        .login-header h1 {
            font-size: 2rem;
            font-weight: 700;
            background: var(--gradient-text);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 0.5rem;
        }

        .login-header p {
            color: #64748b;
            font-size: 1rem;
        }

        .form-group {
            margin-bottom: 1.5rem;
        }

        .form-group label {
            display: block;
            margin-bottom: 0.5rem;
            color: var(--text-dark);
            font-weight: 600;
        }

        .form-control {
            width: 100%;
            padding: 1rem 1.25rem;
            border: 2px solid #e2e8f0;
            border-radius: 1rem;
            font-size: 1rem;
            transition: all 0.3s ease;
            background: var(--white);
        }

        .form-control:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.1);
        }

        .password-input {
            position: relative;
        }

        .password-toggle {
            position: absolute;
            right: 1rem;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            color: #64748b;
            cursor: pointer;
            font-size: 1.1rem;
        }

        .login-btn {
            width: 100%;
            background: var(--gradient-button);
            color: var(--text-light);
            padding: 1.25rem;
            border: none;
            border-radius: 1rem;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-bottom: 1.5rem;
            box-shadow: 0 4px 15px rgba(79, 70, 229, 0.4);
        }

        .login-btn:hover {
            background: var(--gradient-hover);
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(79, 70, 229, 0.6);
        }

        .login-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .alert {
            padding: 1rem;
            border-radius: 0.75rem;
            margin-bottom: 1rem;
            font-weight: 500;
        }

        .alert-success {
            background: #d1fae5;
            color: #065f46;
            border: 1px solid #a7f3d0;
        }

        .alert-error {
            background: #fee2e2;
            color: #991b1b;
            border: 1px solid #fca5a5;
        }

        .back-link {
            text-align: center;
            margin-top: 1.5rem;
        }

        .back-link a {
            color: var(--primary);
            text-decoration: none;
            font-weight: 500;
            transition: color 0.3s ease;
        }

        .back-link a:hover {
            color: var(--primary-light);
        }

        /* Dashboard Styles */
        .dashboard-header {
            text-align: center;
            margin-bottom: 2rem;
        }

        .dashboard-header h2 {
            color: var(--text-dark);
            font-size: 1.8rem;
            font-weight: 700;
            margin-bottom: 0.5rem;
        }

        .student-info {
            background: var(--white);
            padding: 2rem;
            border-radius: 1rem;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            margin-bottom: 2rem;
        }

        .student-info h3 {
            color: var(--primary);
            margin-bottom: 1rem;
        }

        .info-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 1rem;
        }

        .info-item {
            padding: 1rem;
            background: var(--light);
            border-radius: 0.5rem;
        }

        .info-item label {
            font-weight: 600;
            color: var(--text-dark);
            display: block;
            margin-bottom: 0.25rem;
        }

        .info-item span {
            color: #64748b;
        }

        .dashboard-tabs {
            display: flex;
            gap: 1rem;
            margin-bottom: 2rem;
            border-bottom: 2px solid #e2e8f0;
        }

        .tab-btn {
            padding: 1rem 1.5rem;
            background: none;
            border: none;
            color: #64748b;
            font-weight: 600;
            cursor: pointer;
            border-bottom: 2px solid transparent;
            transition: all 0.3s ease;
        }

        .tab-btn.active {
            color: var(--primary);
            border-bottom-color: var(--primary);
        }

        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: block;
        }

        .fee-summary {
            background: var(--white);
            padding: 2rem;
            border-radius: 1rem;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            margin-bottom: 2rem;
        }

        .fee-stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 1rem;
        }

        .fee-stat {
            text-align: center;
            padding: 1rem;
            border-radius: 0.75rem;
        }

        .fee-stat.total {
            background: rgba(79, 70, 229, 0.1);
            color: var(--primary);
        }

        .fee-stat.paid {
            background: rgba(16, 185, 129, 0.1);
            color: var(--secondary);
        }

        .fee-stat.pending {
            background: rgba(245, 158, 11, 0.1);
            color: var(--accent);
        }

        .fee-stat h4 {
            font-size: 1.5rem;
            font-weight: 700;
            margin-bottom: 0.25rem;
        }

        .fee-stat p {
            font-size: 0.875rem;
            opacity: 0.8;
        }

        .transaction-form {
            background: var(--white);
            padding: 2rem;
            border-radius: 1rem;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        .form-row {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 1rem;
        }

        .btn-secondary {
            background: #64748b;
            color: var(--white);
            padding: 0.75rem 1.5rem;
            border: none;
            border-radius: 0.5rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .btn-secondary:hover {
            background: #475569;
        }

        .transaction-history {
            background: var(--white);
            padding: 2rem;
            border-radius: 1rem;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        .transaction-item {
            padding: 1rem;
            border-bottom: 1px solid #e2e8f0;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .transaction-item:last-child {
            border-bottom: none;
        }

        .status-badge {
            padding: 0.25rem 0.75rem;
            border-radius: 20px;
            font-size: 0.75rem;
            font-weight: 600;
            text-transform: uppercase;
        }

        .status-pending {
            background: #fef3c7;
            color: #92400e;
        }

        .status-verified {
            background: #d1fae5;
            color: #065f46;
        }

        .status-rejected {
            background: #fee2e2;
            color: #991b1b;
        }

        .logout-btn {
            position: absolute;
            top: 1rem;
            right: 1rem;
            background: var(--danger);
            color: var(--white);
            padding: 0.5rem 1rem;
            border: none;
            border-radius: 0.5rem;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s ease;
        }

        .logout-btn:hover {
            background: #dc2626;
        }

        @media (max-width: 768px) {
            .container {
                flex-direction: column;
                margin: 1rem;
            }

            .login-section,
            .dashboard-section {
                padding: 2rem;
            }

            .dashboard-tabs {
                flex-direction: column;
            }

            .form-row {
                grid-template-columns: 1fr;
            }

            .fee-stats {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Login Section -->
        <div class="login-section" id="loginSection">
            <div class="login-header">
                <div class="icon">
                    <i class="fas fa-user-graduate"></i>
                </div>
                <h1>Student Portal</h1>
                <p>Access your fee details and manage payments</p>
            </div>

            <div id="alertContainer"></div>

            <form id="loginForm">
                <div class="form-group">
                    <label for="rollNumber">Roll Number</label>
                    <input type="text" id="rollNumber" class="form-control" placeholder="Enter your roll number" required>
                </div>

                <div class="form-group">
                    <label for="password">Password</label>
                    <div class="password-input">
                        <input type="password" id="password" class="form-control" placeholder="Enter password" required>
                        <button type="button" class="password-toggle" onclick="togglePassword()">
                            <i class="fas fa-eye"></i>
                        </button>
                    </div>
                </div>

                <button type="submit" class="login-btn" id="loginBtn">
                    <i class="fas fa-sign-in-alt"></i> Login
                </button>
            </form>

            <div class="back-link">
                <a href="/"><i class="fas fa-arrow-left"></i> Back to Home</a>
            </div>
        </div>

        <!-- Dashboard Section -->
        <div class="dashboard-section" id="dashboardSection">
            <button class="logout-btn" onclick="logout()">
                <i class="fas fa-sign-out-alt"></i> Logout
            </button>

            <div class="dashboard-header">
                <h2>Student Dashboard</h2>
                <p>Manage your fees and view payment history</p>
            </div>

            <div class="student-info" id="studentInfo">
                <!-- Student information will be loaded here -->
            </div>

            <div class="dashboard-tabs">
                <button class="tab-btn active" onclick="showTab('fees')">Fee Details</button>
                <button class="tab-btn" onclick="showTab('payment')">Make Payment</button>
                <button class="tab-btn" onclick="showTab('history')">Payment History</button>
                <button class="tab-btn" onclick="showTab('complaints')">Complaints</button>
            </div>

            <!-- Fee Details Tab -->
            <div id="feesTab" class="tab-content active">
                <div class="fee-summary">
                    <h3>Fee Summary</h3>
                    <div class="fee-stats" id="feeStats">
                        <!-- Fee statistics will be loaded here -->
                    </div>
                </div>
            </div>

            <!-- Make Payment Tab -->
            <div id="paymentTab" class="tab-content">
                <div class="transaction-form">
                    <h3>Submit Payment Details</h3>
                    <form id="paymentForm">
                        <div class="form-row">
                            <div class="form-group">
                                <label for="feeType">Fee Type</label>
                                <select id="feeType" class="form-control" required>
                                    <option value="">Select Fee Type</option>
                                    <option value="Tuition Fee">Tuition Fee</option>
                                    <option value="Hostel Fee">Hostel Fee</option>
                                    <option value="Transport Fee">Transport Fee</option>
                                    <option value="Library Fee">Library Fee</option>
                                    <option value="Lab Fee">Lab Fee</option>
                                    <option value="Other">Other</option>
                                </select>
                            </div>
                            <div class="form-group">
                                <label for="academicYear">Academic Year</label>
                                <select id="academicYear" class="form-control" required>
                                    <option value="">Select Year</option>
                                    <option value="2023-24">2023-24</option>
                                    <option value="2024-25">2024-25</option>
                                </select>
                            </div>
                        </div>
                        <div class="form-row">
                            <div class="form-group">
                                <label for="paidAmount">Amount Paid</label>
                                <input type="number" id="paidAmount" class="form-control" placeholder="Enter amount" required>
                            </div>
                            <div class="form-group">
                                <label for="transDate">Transaction Date</label>
                                <input type="date" id="transDate" class="form-control" required>
                            </div>
                        </div>
                        <div class="form-row">
                            <div class="form-group">
                                <label for="utrNumber">UTR Number</label>
                                <input type="text" id="utrNumber" class="form-control" placeholder="Enter UTR number" required>
                            </div>
                            <div class="form-group">
                                <label for="mobileNumber">Mobile Number</label>
                                <input type="tel" id="mobileNumber" class="form-control" placeholder="Enter mobile number" required>
                            </div>
                        </div>
                        <button type="submit" class="login-btn">
                            <i class="fas fa-paper-plane"></i> Submit Payment Details
                        </button>
                    </form>
                </div>
            </div>

            <!-- Payment History Tab -->
            <div id="historyTab" class="tab-content">
                <div class="transaction-history">
                    <h3>Payment History</h3>
                    <div id="transactionHistory">
                        <!-- Transaction history will be loaded here -->
                    </div>
                </div>
            </div>

            <!-- Complaints Tab -->
            <div id="complaintsTab" class="tab-content">
                <div class="transaction-form">
                    <h3>Submit Complaint</h3>
                    <form id="complaintForm">
                        <div class="form-group">
                            <label for="complaintSubject">Subject</label>
                            <input type="text" id="complaintSubject" class="form-control" placeholder="Enter complaint subject" required>
                        </div>
                        <div class="form-group">
                            <label for="complaintDescription">Description</label>
                            <textarea id="complaintDescription" class="form-control" rows="4" placeholder="Describe your complaint in detail" required></textarea>
                        </div>
                        <button type="submit" class="login-btn">
                            <i class="fas fa-paper-plane"></i> Submit Complaint
                        </button>
                    </form>
                </div>

                <div class="transaction-history" style="margin-top: 2rem;">
                    <h3>My Complaints</h3>
                    <div id="complaintHistory">
                        <!-- Complaint history will be loaded here -->
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        let currentStudent = null;

        // Toggle password visibility
        function togglePassword() {
            const passwordInput = document.getElementById('password');
            const toggleIcon = document.querySelector('.password-toggle i');
            
            if (passwordInput.type === 'password') {
                passwordInput.type = 'text';
                toggleIcon.classList.replace('fa-eye', 'fa-eye-slash');
            } else {
                passwordInput.type = 'password';
                toggleIcon.classList.replace('fa-eye-slash', 'fa-eye');
            }
        }

        // Show alert
        function showAlert(message, type) {
            const alertContainer = document.getElementById('alertContainer');
            const alertClass = type === 'success' ? 'alert-success' : 'alert-error';
            
            alertContainer.innerHTML = `
                <div class="alert ${alertClass}">
                    <i class="fas fa-${type === 'success' ? 'check-circle' : 'exclamation-circle'}"></i>
                    ${message}
                </div>
            `;
            
            setTimeout(() => {
                alertContainer.innerHTML = '';
            }, 5000);
        }

        // Handle login form submission
        document.getElementById('loginForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const rollNumber = document.getElementById('rollNumber').value;
            const password = document.getElementById('password').value;
            const loginBtn = document.getElementById('loginBtn');
            
            if (!rollNumber || !password) {
                showAlert('Please enter both roll number and password', 'error');
                return;
            }
            
            loginBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Logging in...';
            loginBtn.disabled = true;
            
            try {
                const response = await fetch('/api/student/auth', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        rollNumber: rollNumber,
                        password: password
                    })
                });
                
                const data = await response.json();
                
                if (data.success) {
                    currentStudent = data.student;
                    showAlert('Login successful!', 'success');
                    setTimeout(() => {
                        showDashboard();
                    }, 1000);
                } else {
                    showAlert(data.message || 'Login failed', 'error');
                }
            } catch (error) {
                console.error('Login error:', error);
                showAlert('Network error. Please try again.', 'error');
            } finally {
                loginBtn.innerHTML = '<i class="fas fa-sign-in-alt"></i> Login';
                loginBtn.disabled = false;
            }
        });

        // Show dashboard
        function showDashboard() {
            document.getElementById('loginSection').style.display = 'none';
            document.getElementById('dashboardSection').classList.add('active');
            
            loadStudentInfo();
            loadFeeDetails();
            loadPaymentHistory();
            loadComplaints();
        }

        // Load student information
        function loadStudentInfo() {
            if (!currentStudent) return;
            
            const studentInfo = document.getElementById('studentInfo');
            studentInfo.innerHTML = `
                <h3>Student Information</h3>
                <div class="info-grid">
                    <div class="info-item">
                        <label>Name</label>
                        <span>${currentStudent.name}</span>
                    </div>
                    <div class="info-item">
                        <label>Roll Number</label>
                        <span>${currentStudent.rollNumber}</span>
                    </div>
                    <div class="info-item">
                        <label>Branch</label>
                        <span>${currentStudent.branch}</span>
                    </div>
                    <div class="info-item">
                        <label>Academic Year</label>
                        <span>${currentStudent.academicYear}</span>
                    </div>
                </div>
            `;
        }

        // Load fee details
        async function loadFeeDetails() {
            if (!currentStudent) return;
            
            try {
                const response = await fetch(`/api/student/payment-details/${currentStudent.rollNumber}`);
                const data = await response.json();
                
                if (data.success) {
                    const feeStats = document.getElementById('feeStats');
                    feeStats.innerHTML = `
                        <div class="fee-stat total">
                            <h4>₹${data.student.totalFees}</h4>
                            <p>Total Fees</p>
                        </div>
                        <div class="fee-stat paid">
                            <h4>₹${data.student.paidAmount}</h4>
                            <p>Paid Amount</p>
                        </div>
                        <div class="fee-stat pending">
                            <h4>₹${data.student.pendingAmount}</h4>
                            <p>Pending Amount</p>
                        </div>
                    `;
                }
            } catch (error) {
                console.error('Error loading fee details:', error);
            }
        }

        // Load payment history
        async function loadPaymentHistory() {
            if (!currentStudent) return;
            
            try {
                const response = await fetch(`/api/student/transactions/${currentStudent.rollNumber}`);
                const data = await response.json();
                
                if (data.success) {
                    const historyContainer = document.getElementById('transactionHistory');
                    
                    if (data.transactions.length === 0) {
                        historyContainer.innerHTML = '<p>No payment history found.</p>';
                        return;
                    }
                    
                    historyContainer.innerHTML = data.transactions.map(transaction => `
                        <div class="transaction-item">
                            <div>
                                <strong>${transaction.feeType}</strong><br>
                                <small>Transaction ID: ${transaction.id}</small><br>
                                <small>Date: ${new Date(transaction.date).toLocaleDateString()}</small>
                            </div>
                            <div style="text-align: right;">
                                <strong>₹${transaction.amount}</strong><br>
                                <span class="status-badge status-${transaction.status}">${transaction.status}</span>
                            </div>
                        </div>
                    `).join('');
                }
            } catch (error) {
                console.error('Error loading payment history:', error);
            }
        }

        // Load complaints
        async function loadComplaints() {
            if (!currentStudent) return;
            
            try {
                const response = await fetch(`/api/student/complaints/${currentStudent.rollNumber}`);
                const data = await response.json();
                
                if (data.success) {
                    const complaintsContainer = document.getElementById('complaintHistory');
                    
                    if (data.complaints.length === 0) {
                        complaintsContainer.innerHTML = '<p>No complaints found.</p>';
                        return;
                    }
                    
                    complaintsContainer.innerHTML = data.complaints.map(complaint => `
                        <div class="transaction-item">
                            <div>
                                <strong>${complaint.subject}</strong><br>
                                <small>${complaint.description}</small><br>
                                <small>Date: ${new Date(complaint.date).toLocaleDateString()}</small>
                                ${complaint.response ? `<br><small><strong>Response:</strong> ${complaint.response}</small>` : ''}
                            </div>
                            <div style="text-align: right;">
                                <span class="status-badge status-${complaint.status}">${complaint.status}</span>
                            </div>
                        </div>
                    `).join('');
                }
            } catch (error) {
                console.error('Error loading complaints:', error);
            }
        }

        // Show tab
        function showTab(tabName) {
            // Hide all tabs
            document.querySelectorAll('.tab-content').forEach(tab => {
                tab.classList.remove('active');
            });
            
            // Remove active class from all buttons
            document.querySelectorAll('.tab-btn').forEach(btn => {
                btn.classList.remove('active');
            });
            
            // Show selected tab
            document.getElementById(tabName + 'Tab').classList.add('active');
            event.target.classList.add('active');
        }

        // Handle payment form submission
        document.getElementById('paymentForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            if (!currentStudent) {
                showAlert('Please login first', 'error');
                return;
            }
            
            const formData = {
                rollNumber: currentStudent.rollNumber,
                feeType: document.getElementById('feeType').value,
                academicYear: document.getElementById('academicYear').value,
                paidAmount: document.getElementById('paidAmount').value,
                transDate: document.getElementById('transDate').value,
                utrNumber: document.getElementById('utrNumber').value,
                mobileNumber: document.getElementById('mobileNumber').value
            };
            
            // Validate form
            if (!formData.feeType || !formData.academicYear || !formData.paidAmount || 
                !formData.transDate || !formData.utrNumber || !formData.mobileNumber) {
                showAlert('Please fill all required fields', 'error');
                return;
            }
            
            const submitBtn = event.target.querySelector('button[type="submit"]');
            submitBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Submitting...';
            submitBtn.disabled = true;
            
            try {
                const response = await fetch('/api/student/submit-transaction', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(formData)
                });
                
                const data = await response.json();
                
                if (data.success) {
                    showAlert('Payment details submitted successfully! Your transaction is pending verification.', 'success');
                    document.getElementById('paymentForm').reset();
                    loadPaymentHistory(); // Refresh payment history
                } else {
                    showAlert(data.message || 'Failed to submit payment details', 'error');
                }
            } catch (error) {
                console.error('Payment submission error:', error);
                showAlert('Network error. Please try again.', 'error');
            } finally {
                submitBtn.innerHTML = '<i class="fas fa-paper-plane"></i> Submit Payment Details';
                submitBtn.disabled = false;
            }
        });

        // Handle complaint form submission
        document.getElementById('complaintForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            if (!currentStudent) {
                showAlert('Please login first', 'error');
                return;
            }
            
            const subject = document.getElementById('complaintSubject').value;
            const description = document.getElementById('complaintDescription').value;
            
            if (!subject || !description) {
                showAlert('Please fill all required fields', 'error');
                return;
            }
            
            const submitBtn = event.target.querySelector('button[type="submit"]');
            submitBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Submitting...';
            submitBtn.disabled = true;
            
            try {
                const response = await fetch('/api/student/complaint', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        subject: subject,
                        description: description
                    })
                });
                
                const data = await response.json();
                
                if (data.success) {
                    showAlert('Complaint submitted successfully!', 'success');
                    document.getElementById('complaintForm').reset();
                    loadComplaints(); // Refresh complaints
                } else {
                    showAlert(data.message || 'Failed to submit complaint', 'error');
                }
            } catch (error) {
                console.error('Complaint submission error:', error);
                showAlert('Network error. Please try again.', 'error');
            } finally {
                submitBtn.innerHTML = '<i class="fas fa-paper-plane"></i> Submit Complaint';
                submitBtn.disabled = false;
            }
        });

        // Logout function
        function logout() {
            if (confirm('Are you sure you want to logout?')) {
                currentStudent = null;
                document.getElementById('dashboardSection').classList.remove('active');
                document.getElementById('loginSection').style.display = 'block';
                
                // Reset forms
                document.getElementById('loginForm').reset();
                document.getElementById('paymentForm').reset();
                document.getElementById('complaintForm').reset();
                
                // Clear data
                document.getElementById('studentInfo').innerHTML = '';
                document.getElementById('feeStats').innerHTML = '';
                document.getElementById('transactionHistory').innerHTML = '';
                document.getElementById('complaintHistory').innerHTML = '';
            }
        }

        // Set default date to today
        document.addEventListener('DOMContentLoaded', function() {
            const today = new Date().toISOString().split('T')[0];
            document.getElementById('transDate').value = today;
        });
    </script>
</body>
</html>
